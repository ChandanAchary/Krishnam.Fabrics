# LabourFlow — local Supabase configuration (for `supabase` CLI users).
# Adjust project_id to match your linked Supabase project.

project_id = "labourflow"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

# NOTE: In this Next.js build, the Brevo email-OTP flow runs as a Next.js API
# route (src/app/api/account-otp/route.ts), NOT a Supabase Edge Function.
# Supabase is used for database + auth only.
