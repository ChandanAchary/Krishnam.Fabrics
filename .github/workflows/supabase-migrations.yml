name: Deploy Supabase migrations

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply production migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Check required secrets
        shell: bash
        run: |
          missing=0

          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done

          exit "$missing"

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check Supabase CLI
        run: npx --yes supabase@latest --version

      - name: Link Supabase project
        run: npx --yes supabase@latest link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show migration status
        run: npx --yes supabase@latest migration list --linked

      - name: Preview pending migrations
        run: npx --yes supabase@latest db push --dry-run

      - name: Apply database migrations
        run: npx --yes supabase@latest db push
